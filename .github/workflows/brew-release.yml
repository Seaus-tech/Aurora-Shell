name: Homebrew Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tarball and release
        run: |
          set -x
          TAG=${GITHUB_REF#refs/tags/}
          TARBALL="aurora-shell-${TAG}.tar.gz"

          # Bump VER in install.sh to match the tag
          sed -i "s|^VER=\".*\"|VER=\"${TAG#v}\"|" install.sh

          # Build tarball from repo contents
          mkdir -p aurora-shell-pkg
          cp install.sh brew-install.sh aurora-shell-pkg/
          [ -f shell.aurora ] && cp shell.aurora aurora-shell-pkg/ || true
          tar -czf "$TARBALL" aurora-shell-pkg/

          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          echo "SHA=$SHA" >> $GITHUB_ENV
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "ASSET_URL=https://github.com/Seaus-tech/Aurora-Shell/releases/download/${TAG}/${TARBALL}" >> $GITHUB_ENV

      - name: Create GitHub Release with tarball
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARBALL }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula in tap repo
        run: |
          set -x
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/Seaus-tech/homebrew-aurora-shell.git tap
          cd tap

          sed -i "s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/aurora-shell.rb
          sed -i "s|url \".*\"|url \"$ASSET_URL\"|" Formula/aurora-shell.rb
          sed -i "s|version \".*\"|version \"${TAG#v}\"|" Formula/aurora-shell.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aurora-shell.rb
          git commit -m "chore: update formula for ${TAG}" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
