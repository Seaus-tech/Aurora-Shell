<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Matte Charcoal Base (Apple Style) -->
    <linearGradient id="appleBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#181819" />
    </linearGradient>

    <!-- Aurora Customization Layer for the prompt cursor -->
    <linearGradient id="auroraCursor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Soft, subtle ambient shadow inside the tile -->
    <radialGradient id="innerGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Apple's Continuous Curvature Squircle Base Tile -->
  <rect width="512" height="512" rx="115" fill="url(#appleBase)" />
  <rect width="512" height="512" rx="115" fill="url(#innerGlow)" />

  <!-- Centered Minimalist Code Elements -->
  <g transform="translate(20, 15)">
    <!-- Iconic Apple Terminal Chevron (>) -->
    <path d="M 130,165 L 235,240 L 130,315" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Aurora-Shell Customized Blinking Cursor (_ ) -->
    <line x1="270" y1="315" x2="375" y2="315" 
          stroke="url(#auroraCursor)" 
          stroke-width="36" 
          stroke-linecap="round" />
  </g>
</svg>
